    <circle cx="164" cy="292" r="42" fill="#d4d8dd"/>
    <circle cx="164" cy="292" r="33" fill="url(#lens)"/>
    <circle cx="152" cy="280" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="348" cy="292" r="42" fill="#d4d8dd"/>
    <circle cx="348" cy="292" r="33" fill="url(#lens)"/>
    <circle cx="336" cy="280" r="8" fill="#ffffff" opacity="0.9"/>
    <!-- 小さなグリル開口 -->
    <ellipse cx="256" cy="342" rx="52" ry="17" fill="#14080a"/>
    <ellipse cx="256" cy="336" rx="40" ry="5" fill="#ffffff" opacity="0.08"/>
