    <rect x="356" y="356" width="52" height="48" rx="10" fill="#0a0a0a"/>
    <!-- フロントガラス（オープン状態の窓枠） -->
    <path d="M150 246 L184 176 Q256 166 328 176 L362 246 Z" fill="url(#glass)" stroke="#c9ced4" stroke-width="7" stroke-linejoin="round"/>
    <path d="M196 188 Q226 182 250 182 L222 236 L176 236 Z" fill="#ffffff" opacity="0.12"/>
    <!-- ミラー -->
    <ellipse cx="132" cy="240" rx="20" ry="13" fill="#b8131b"/>
    <ellipse cx="380" cy="240" rx="20" ry="13" fill="#b8131b"/>
    <!-- 丸みのあるボディ -->
    <path d="M92 306 C92 256 136 238 192 234 L320 234 C376 238 420 256 420 306 L420 350 C420 372 404 386 382 386 L130 386 C108 386 92 372 92 350 Z" fill="url(#body)"/>
    <!-- ボンネットのハイライト -->
    <path d="M150 252 Q256 238 362 252 Q256 262 150 252 Z" fill="#ffffff" opacity="0.28"/>
